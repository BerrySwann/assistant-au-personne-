# ╭──────────────────────────────────────────────────────────────────────────────╮
# │          MODULE M10-GROUPE — ENVOI ALERTES AUX AIDANTS (PACKAGE)            │
# ╰──────────────────────────────────────────────────────────────────────────────╯
# v3 (2026-08-05) : remontée 100% AUTOMATIQUE des person.* — plus aucun nom
# d'aidant en dur. Les destinataires sont calculés à la volée à partir des
# entités person.* présentes dans Home Assistant.
#
# Convention de nommage (seule chose à respecter) :
#   - person.eric = personne aidée (exclue de tous les envois)
#   - case à cocher d'un aidant = helper input_boolean.m10_prox_<object_id>
#     ex : person.jean  ->  input_boolean.m10_prox_jean
#   - Création du helper (UI Paramètres > Aides, ou hab) :
#       hab helper input-boolean create m10_prox_jean --icon mdi:account-heart
#       hab entity rename input_boolean.m10_prox_jean "Jean"
#     Les helpers vivent dans le registre HA : ils survivent aux
#     redémarrages, et disparaissent quand on les supprime.
#
# Comportement automatique :
#   - Case cochée   = aidant de proximité -> reçoit le SOS.
#   - Case absente  = aidant ignoré sans erreur (personne supprimée dans HA
#     = zéro édition de fichier, elle sort toute seule des envois).
#   - Nouveau bouton créé -> pris en compte immédiatement par le script SOS.
#   - Le dashboard Configuration affiche ces cases automatiquement via la
#     carte auto-entities (filtre input_boolean.m10_prox_*).
#
# ⚠️ INCOHÉRENCE CONNUE (repérée le 2026-08-15, PAS corrigée — hors périmètre
# de la session en cours) : ce fichier utilise input_boolean.m10_prox_
# <object_id> (dynamique), alors que m10_gestion_aidants.yaml déclare
# input_boolean.m10_proximite_aidant_1 à _7 (7 aidants fixes). Les deux
# mécanismes coexistent dans le repo sans lien entre eux — à clarifier avant
# d'activer réellement les notify.send_message ci-dessous (aujourd'hui
# commentés/désactivés).
# ⚠️ m10_envoyer_alerte_moderee n'est appelé nulle part actuellement (script
# orphelin, prêt mais jamais déclenché).

script:
  m10_envoyer_alerte_sos:
    alias: "M10 - Envoyer alerte SOS aux aidants de proximité cochés"
    sequence:
      # DÉSACTIVÉ — nécessite Companion app sur chaque téléphone. Le code
      # ci-dessous est prêt et fonctionnel, à réactiver une fois qu'au moins
      # un aidant a l'app installée et connectée (device_tracker actif).
