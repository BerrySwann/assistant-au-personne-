      #   data:
      #     title: "🚨 SOS déclenché"
      #     message: "Bouton d'urgence pressé. Vérifier la personne immédiatement."

  m10_envoyer_alerte_moderee:
    alias: "M10 - Envoyer alerte modérée aux aidants ayant le droit 🚨 Alertes"
    fields:
      titre:
        description: "Titre de la notification"
      message:
        description: "Contenu du message"
    sequence:
      # DÉSACTIVÉ — mêmes contraintes que m10_envoyer_alerte_sos.
      #
      # 2026-08-15 (suite, remplacement des PIN par les droits) : jusqu'ici
      # ce template envoyait à TOUS les person.* sans distinction (aucun
      # filtre). Corrigé pour ne cibler que les aidants ayant coché le
      # nouveau droit "🚨 Alertes" (bit 32) dans input_text.
      # m10_droits_aidants — voir m10_gestion_aidants.yaml pour le détail du
      # bitmask. Décision explicite de l'utilisateur : ce droit est SÉPARÉ
      # du système input_boolean.m10_proximite_aidant_* (SOS) ci-dessus —
      # deux mécanismes indépendants, ne pas les fusionner.
