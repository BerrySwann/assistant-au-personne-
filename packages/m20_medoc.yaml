# ╭──────────────────────────────────────────────────────────────────────────────╮
# │          MODULE M13 (M20) — RAPPEL MÉDICAMENTS (PACKAGE)                    │
# ╰──────────────────────────────────────────────────────────────────────────────╯
# Créé le 2026-08-16.
#
# RÔLE : afficher un rappel sur l'écran de la personne aidée à l'heure de
# prise, pour 4 moments de la journée (matin / midi / soir / coucher), chacun
# avec son heure réglable et activable indépendamment. Le rappel s'affiche
# pendant une durée réglable puis disparaît tout seul — PAS d'acquittement
# (décision utilisateur 2026-08-16).
#
# ⚠️ CE MODULE NE DÉTECTE RIEN. Il ne sait pas si le médicament a été pris.
# C'est un simple RAPPEL. Il ne convient PAS à tous les profils : pour une
# personne à risque de reprise (qui oublie qu'elle a déjà pris et reprend →
# surdosage), un rappel seul peut être dangereux. À n'activer que selon la
# pathologie, en s'appuyant sur un pilulier hebdomadaire préparé par un aidant
# (le rappel pointe vers le bon COMPARTIMENT, il ne distribue rien).
# Voir CAHIER_DES_CHARGES.md §8.
#
# ⚠️ input_boolean.module_m20_medoc (interrupteur du module) est déjà déclaré
# dans m00_modules.yaml — NE PAS le redéclarer ici (conflit de clé).
#
# LOGIQUE : aucun automation. Le kiosk (www/kiosk.html) lit ces entités et
# calcule lui-même s'il faut afficher un rappel : pour chaque zone active, si
# l'heure courante est dans [heure_zone ; heure_zone + durée]. Simple,
# distribuable (rien à importer), même approche que les sessions TV.
#
# ⚠️ Volontairement PAS de `initial:` (piège HA documenté, cf. M10) : sinon
# les heures réglées par l'utilisateur seraient écrasées à chaque redémarrage.
# À la toute première création, les heures valent 00:00 — à régler une fois
# via Configuration → Sécurité → Rappels médicaments.

input_datetime:
  m20_medoc_matin:
    name: "M20 Médoc — Heure Matin"
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-up
  m20_medoc_midi:
    name: "M20 Médoc — Heure Midi"
    has_date: false
    has_time: true
    icon: mdi:weather-sunny
  m20_medoc_soir:
    name: "M20 Médoc — Heure Soir"
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-down
  m20_medoc_couche:
    name: "M20 Médoc — Heure Coucher"
    has_date: false
    has_time: true
    icon: mdi:weather-night

input_boolean:
  m20_medoc_matin_actif:
    name: "M20 Médoc — Matin activé"
    icon: mdi:pill
  m20_medoc_midi_actif:
    name: "M20 Médoc — Midi activé"
    icon: mdi:pill
  m20_medoc_soir_actif:
    name: "M20 Médoc — Soir activé"
    icon: mdi:pill
  m20_medoc_couche_actif:
    name: "M20 Médoc — Coucher activé"
    icon: mdi:pill

input_number:
  # Durée d'affichage du rappel à l'écran (en minutes), commune aux 4 zones.
  m20_medoc_duree_min:
    name: "M20 Médoc — Durée d'affichage (min)"
    min: 5
    max: 240
    step: 5
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-outline

# annotations_log:
# - 2026-08-16 : création. 4 zones (matin/midi/soir/coucher), heure réglable +
#   activation par zone, durée d'affichage commune. Rappel pur, affiché puis
#   effacé, sans acquittement ni alerte aidant (décisions utilisateur). Calcul
#   côté kiosk (pas d'automation). Pas de `initial:` (piège HA).
