              {% set marge = 30 %}
              {% set start_attr = state_attr(epg_entity, 'start') if epg_entity else None %}
              {% set cible_min = (cible.split(':')[0] | int) * 60 + (cible.split(':')[1] | int) %}
              {% if start_attr is not none %}
                {% set start_t = start_attr | as_datetime | as_local %}
                {% set start_min = start_t.hour * 60 + start_t.minute %}
                {{ start_t.strftime('%H:%M:%S') if (start_min - cible_min) | abs <= marge else cible }}
              {% else %}{{ cible }}{% endif %}
            {% endif %}
          fin_reelle: >
            {% set chaine = states('input_select.m34_session3_chaine') %}
            {% set cible_debut = states('input_datetime.m34_session3_debut') %}
            {% set cible_fin = states('input_datetime.m34_session3_fin') %}
            {% if chaine == 'YouTube' %}{{ cible_fin }}{% else %}
              {% set epg_entity = {'France 2': 'sensor.france2_fr_program_current', 'Arte': 'sensor.arte_fr_program_current', 'France 5': 'sensor.france5_fr_program_current'}.get(chaine) %}
              {% set marge = 30 %}
              {% set marge_fin = 5 %}
              {% set start_attr = state_attr(epg_entity, 'start') if epg_entity else None %}
              {% set stop_attr = state_attr(epg_entity, 'end') if epg_entity else None %}
              {% set cible_debut_min = (cible_debut.split(':')[0] | int) * 60 + (cible_debut.split(':')[1] | int) %}
              {% if start_attr is not none and stop_attr is not none %}
                {% set start_t = start_attr | as_datetime | as_local %}
                {% set start_min = start_t.hour * 60 + start_t.minute %}
                {% if (start_min - cible_debut_min) | abs <= marge %}
                  {% set stop_t = (stop_attr | as_datetime | as_local) + timedelta(minutes=marge_fin) %}
                  {{ stop_t.strftime('%H:%M:%S') }}
                {% else %}{{ cible_fin }}{% endif %}
              {% else %}{{ cible_fin }}{% endif %}
            {% endif %}

      - name: "M34 Session 4 Fenêtre"
        unique_id: m34_session4_fenetre
        icon: mdi:clock-outline
        state: "ok"
        attributes:
          debut_reel: >
            {% set chaine = states('input_select.m34_session4_chaine') %}
            {% set cible = states('input_datetime.m34_session4_debut') %}
            {% if chaine == 'YouTube' %}{{ cible }}{% else %}
              {% set epg_entity = {'France 2': 'sensor.france2_fr_program_current', 'Arte': 'sensor.arte_fr_program_current', 'France 5': 'sensor.france5_fr_program_current'}.get(chaine) %}
              {% set marge = 30 %}
              {% set start_attr = state_attr(epg_entity, 'start') if epg_entity else None %}
              {% set cible_min = (cible.split(':')[0] | int) * 60 + (cible.split(':')[1] | int) %}
              {% if start_attr is not none %}
                {% set start_t = start_attr | as_datetime | as_local %}
                {% set start_min = start_t.hour * 60 + start_t.minute %}
                {{ start_t.strftime('%H:%M:%S') if (start_min - cible_min) | abs <= marge else cible }}
              {% else %}{{ cible }}{% endif %}
            {% endif %}
          fin_reelle: >
            {% set chaine = states('input_select.m34_session4_chaine') %}
            {% set cible_debut = states('input_datetime.m34_session4_debut') %}
            {% set cible_fin = states('input_datetime.m34_session4_fin') %}
            {% if chaine == 'YouTube' %}{{ cible_fin }}{% else %}
              {% set epg_entity = {'France 2': 'sensor.france2_fr_program_current', 'Arte': 'sensor.arte_fr_program_current', 'France 5': 'sensor.france5_fr_program_current'}.get(chaine) %}
              {% set marge = 30 %}
              {% set marge_fin = 5 %}
              {% set start_attr = state_attr(epg_entity, 'start') if epg_entity else None %}
              {% set stop_attr = state_attr(epg_entity, 'end') if epg_entity else None %}
              {% set cible_debut_min = (cible_debut.split(':')[0] | int) * 60 + (cible_debut.split(':')[1] | int) %}
              {% if start_attr is not none and stop_attr is not none %}
                {% set start_t = start_attr | as_datetime | as_local %}
                {% set start_min = start_t.hour * 60 + start_t.minute %}
                {% if (start_min - cible_debut_min) | abs <= marge %}
                  {% set stop_t = (stop_attr | as_datetime | as_local) + timedelta(minutes=marge_fin) %}
                  {{ stop_t.strftime('%H:%M:%S') }}
                {% else %}{{ cible_fin }}{% endif %}
              {% else %}{{ cible_fin }}{% endif %}
            {% endif %}

      # ─────────────────────────────────────────────
      # ÉTAT GLOBAL — quelle session (si aucune) est active MAINTENANT
      # ─────────────────────────────────────────────
      - name: "M34 État Global"
        unique_id: m34_etat_global
        icon: mdi:television-play
        state: >
          {% if not is_state('input_boolean.module_m34_television', 'on') %}
            desactive
          {% else %}
            {% set now_t = now().strftime('%H:%M:00') %}
            {# ⚠️ 2026-08-14 : entity_id réels (confirmés registre HA), PAS les
               unique_id/noms "propres" — dérivés du texte name: au moment de
               la création, ne changent pas si le texte change ensuite.
               Session 2 a un slug particulier (sans le "2") — vérifié en direct. #}
            {% set d1 = state_attr('sensor.confo_m34_session_1_fenetre','debut_reel') %}
            {% set f1 = state_attr('sensor.confo_m34_session_1_fenetre','fin_reelle') %}
            {% set d2 = state_attr('sensor.confo_m34_session_fenetre','debut_reel') %}
            {% set f2 = state_attr('sensor.confo_m34_session_fenetre','fin_reelle') %}
            {% set d3 = state_attr('sensor.confo_m34_session_3_fenetre','debut_reel') %}
            {% set f3 = state_attr('sensor.confo_m34_session_3_fenetre','fin_reelle') %}
            {% set d4 = state_attr('sensor.confo_m34_session_4_fenetre','debut_reel') %}
            {% set f4 = state_attr('sensor.confo_m34_session_4_fenetre','fin_reelle') %}
            {% set s1_ok = is_state('input_boolean.m34_session1_actif', 'on') and d1 is not none and f1 is not none and d1 not in ('', 'unknown') and f1 not in ('', 'unknown') and d1 <= now_t < f1 %}
            {% set s2_ok = is_state('input_boolean.m34_session2_actif', 'on') and d2 is not none and f2 is not none and d2 not in ('', 'unknown') and f2 not in ('', 'unknown') and d2 <= now_t < f2 %}
            {% set s3_ok = is_state('input_boolean.m34_session3_actif', 'on') and d3 is not none and f3 is not none and d3 not in ('', 'unknown') and f3 not in ('', 'unknown') and d3 <= now_t < f3 %}
            {% set s4_ok = is_state('input_boolean.m34_session4_actif', 'on') and d4 is not none and f4 is not none and d4 not in ('', 'unknown') and f4 not in ('', 'unknown') and d4 <= now_t < f4 %}
            {% if s1_ok %}session1
            {% elif s2_ok %}session2
            {% elif s3_ok %}session3
            {% elif s4_ok %}session4
            {% else %}photos{% endif %}
          {% endif %}
        attributes:
          texte_affichage: >
            {% set etat = states('sensor.confo_m34_etat_global') %}
            {% if etat == 'desactive' %}Écran Télévision (désactivée)
            {% elif etat in ['session1','session2','session3','session4'] %}
              {% set n = etat[-1] %}
              {% set chaine = states('input_select.m34_session' ~ n ~ '_chaine') %}
              {% set epg_entity = {'France 2': 'sensor.france2_fr_program_current', 'Arte': 'sensor.arte_fr_program_current', 'France 5': 'sensor.france5_fr_program_current'}.get(chaine) %}
              {% set titre = state_attr(epg_entity, 'title') if epg_entity else None %}
              📺 Écran Télévision — {{ chaine }}{% if chaine == 'YouTube' %} (Session {{ n }}){% elif titre %} — {{ titre }}{% endif %}
            {% else %}📷 Écran Photos Famille{% endif %}

script:
  m34_lancer_session:
    alias: "M34 — Lancer la chaîne/vidéo d'une session"
    fields:
      num:
        description: "Numéro de session (1, 2, 3 ou 4)"
        example: 1
    sequence:
      - variables:
          chaine: "{{ states('input_select.m34_session' ~ num ~ '_chaine') }}"
          label: >
            {% if chaine == 'France 2' %}france2
            {% elif chaine == 'france tv' %}francetv
            {% elif chaine == 'Arte' %}arte
            {% elif chaine == 'TV5 Monde' %}tv5monde
            {% elif chaine == 'Nat Geo' %}natgeo
            {% else %}all{% endif %}
      # M34 — Rotation automatique des liens (module M34 activé) : injecte la
      # plus récente vidéo non vue de la chaîne choisie (ou toutes si
      # YouTube/autre). Module OFF = pas de rotation (URL manuelle de la
      # session, vidée). L'affichage se fait via la carte iframe du kiosk
      # (sensor.confo_m34_video_en_cours_embed).
      #
      # ⚠️ 2026-08-14 : NE marque PLUS "déjà_vu" ici immédiatement (ancien
      # bug signalé par l'utilisateur : marquait la vidéo en cours dès que ce
      # script re-tournait, même juste commencée/à peine vue — notamment à
      # chaque changement de chaîne via m34_chaine_changee_en_session_active).
      # Le marquage se fait maintenant 5 min avant la fin RÉELLE de la vidéo,
      # via input_datetime.m34_session{num}_marquer_vu_a calculé plus bas +
      # l'automation m34_marquer_vu_apres_visionnage (m34_liens_youtube.yaml).
      - if:
          - condition: template
            value_template: "{{ is_state('input_boolean.module_m34_liens_youtube', 'on') }}"
        then:
          - action: shell_command.m34_liens_youtube
            data:
              action: next
              arg2: "{{ label }}"
            response_variable: m34_next
          - variables:
              url: "{{ m34_next['stdout'] | trim if m34_next else '' }}"
          - condition: template
            value_template: "{{ url | trim != '' }}"
          - action: input_text.set_value
            target:
              entity_id: "input_text.m34_session{{ num }}_youtube_url"
            data:
              value: "{{ url }}"
          - variables:
              video_id: >
                {% if 'youtu.be/' in url %}{{ url.split('/')[-1].split('?')[0] }}
                {% elif 'v=' in url %}{{ url.split('v=')[-1].split('&')[0] }}
                {% else %}{% endif %}
          - action: shell_command.m34_liens_youtube
            data:
              action: duration
              arg2: "{{ video_id }}"
            response_variable: m34_duration
          - variables:
              duree_s: "{{ (m34_duration['stdout'] | trim | int(0)) if m34_duration else 0 }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: "input_datetime.m34_session{{ num }}_marquer_vu_a"
            data:
              timestamp: >
                {% if duree_s > 300 %}{{ (now().timestamp() + duree_s - 300) | int }}
                {% else %}{{ (now().timestamp() + 60) | int }}{% endif %}

automation:
  - id: m34_verifier_sessions
    alias: "M34 — Vérifier les sessions TV (toutes les minutes)"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
    condition:
      - condition: state
        entity_id: input_boolean.module_m34_television
        state: "on"
    action:
      - variables:
          etat: "{{ states('sensor.confo_m34_etat_global') }}"
          affichee: "{{ states('input_text.m34_session_affichee') }}"
      - condition: template
        value_template: "{{ etat != affichee }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.m34_session_affichee
        data:
          value: "{{ etat }}"
      - choose:
          - conditions: "{{ etat == 'session1' }}"
            sequence:
              - service: script.m34_lancer_session
                data:
                  num: 1
          - conditions: "{{ etat == 'session2' }}"
            sequence:
              - service: script.m34_lancer_session
                data:
                  num: 2
          - conditions: "{{ etat == 'session3' }}"
            sequence:
              - service: script.m34_lancer_session
                data:
                  num: 3
          - conditions: "{{ etat == 'session4' }}"
            sequence:
              - service: script.m34_lancer_session
                data:
                  num: 4
        default:
          - service: script.turn_on
            target:
              entity_id: script.m31_lancer_diaporama

  - id: m34_reset_desactivation
    alias: "M34 — Retour photos si module TV désactivé"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.module_m34_television
        to: "off"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.m34_session_affichee
        data:
          value: "aucune"
      - service: script.turn_on
        target:
          entity_id: script.m31_lancer_diaporama

  - id: m34_seed_horaires_defaut
    alias: "M34 — Horaires par défaut (une seule fois, démarrage HA)"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.m34_horaires_initialises
        state: "off"
    action:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.m34_session1_debut
        data:
          time: "09:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.m34_session1_fin
        data:
          time: "12:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.m34_session2_debut
        data:
          time: "14:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.m34_session2_fin
        data:
          time: "17:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.m34_session3_debut
        data:
          time: "18:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.m34_session3_fin
        data:
          time: "22:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.m34_session4_debut
        data:
          time: "00:00:00"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.m34_session4_fin
        data:
          time: "00:00:00"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.m34_session1_actif
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.m34_session2_actif
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.m34_session3_actif
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.m34_session4_actif
      - action: input_select.select_option
        target:
          entity_id: input_select.m34_session1_chaine
        data:
          option: "france tv"
      - action: input_select.select_option
        target:
          entity_id: input_select.m34_session2_chaine
        data:
          option: "Arte"
      - action: input_select.select_option
        target:
          entity_id: input_select.m34_session3_chaine
        data:
          option: "TV5 Monde"
      - action: input_select.select_option
        target:
          entity_id: input_select.m34_session4_chaine
        data:
          option: "TV5 Monde"
      # [RETIRÉ 2026-08-18] Seed de input_text.m34_browser_id_tv — entité
      # supprimée, plus utilisée (voir en-tête de fichier + M34_television.md).
      - action: input_text.set_value
        target:
          entity_id: input_text.m34_session1_youtube_url
        data:
          value: "https://youtu.be/qTtsuHLHs-8"
      - action: input_text.set_value
        target:
          entity_id: input_text.m34_session2_youtube_url
        data:
          value: "https://youtu.be/Qwp87WfdLIQ"
      - action: input_text.set_value
        target:
          entity_id: input_text.m34_session3_youtube_url
        data:
          value: "https://youtu.be/RfoBKr1RtJ4"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.m34_horaires_initialises

  - id: m34_chaine_changee_en_session_active
    alias: "M34 — Rechargement immédiat si chaîne changée en session active"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_select.m34_session1_chaine
          - input_select.m34_session2_chaine
          - input_select.m34_session3_chaine
          - input_select.m34_session4_chaine
    condition:
      - condition: template
        value_template: >
          {% set etat = states('sensor.confo_m34_etat_global') %}
          {% set num_session = trigger.entity_id.split('.')[1].split('_')[1][-1] %}
          {{ etat in ['session1','session2','session3','session4'] and etat[-1] == num_session }}
    action:
      - variables:
          num: "{{ trigger.entity_id.split('.')[1].split('_')[1][-1] }}"
      - service: script.m34_lancer_session
        data:
          num: "{{ num }}"

  - id: m34_bouton_ok_session
    alias: "M34 — Bouton OK : relancer la session avec la chaîne choisie"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_button.m34_session1_ok
          - input_button.m34_session2_ok
          - input_button.m34_session3_ok
          - input_button.m34_session4_ok
        to: null
    action:
      - variables:
          num: "{{ trigger.entity_id[-1] }}"
      - service: script.m34_lancer_session
        data:
          num: "{{ num }}"
