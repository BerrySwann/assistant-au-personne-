# ╭──────────────────────────────────────────────────────────────────────────────╮
# │          MODULE M34 — TÉLÉVISION : 3 SESSIONS CONFIGURABLES (PACKAGE)      │
# ╰──────────────────────────────────────────────────────────────────────────────╯
# Rôle : bascule Photos (M08) ↔ TV sur l'unique écran (TV salon, mini-PC/RPi4
#        en HDMI, navigateur enregistré dans Browser Mod), selon jusqu'à
#        3 "sessions TV" indépendantes, chacune avec son propre interrupteur
#        on/off, ses horaires, et son choix de chaîne (France 2/Arte/France 5)
#        ou YouTube. Pilotage par redirection du navigateur
#        (browser_mod.javascript), PAS par casting Chromecast (abandonné le
#        2026-07-04, voir hardware.md).
#
# Révision 2026-07-04 (v2) : généralisation de l'ancien système à 2 créneaux
# fixes (créneau1 EPG + créneau2 YouTube fixe) vers 3 sessions identiques et
# configurables individuellement (demande utilisateur : "calendrier" avec
# jusqu'à 3 sessions, chacune activable/désactivable).
#
# Pour chaque session N (1 à 3) :
#   - input_boolean.m34_sessionN_actif      → active/désactive CETTE session sans effacer sa config
#   - input_datetime.m34_sessionN_debut/fin → heures cibles (fallback si pas d'EPG, ou horaire fixe si YouTube)
#   - input_select.m34_sessionN_chaine      → France 2 / Arte / France 5 / YouTube
#   - input_text.m34_sessionN_youtube_url   → URL vidéo YouTube (si chaîne = YouTube)
#
# ⚠️ POINTS NON CONFIRMÉS / À SURVEILLER :
#   1. [RETIRÉ 2026-08-18] Ancien point "SÉCURITÉ BROWSER_ID" — ne s'applique
#      plus. input_text.m34_browser_id_tv (et le mécanisme de redirection
#      navigateur qu'il sécurisait) a été supprimé : plus utilisé depuis la
#      bascule du 14/08 vers kiosk.html en HTML pur (affichage par iframe,
#      pas de redirection de navigateur externe pour la TV).
#   2. EPG : confirmé le 2026-07-04 avec XMLTV EPG (HACS) + source xmltvfr.fr
#      (https://xmltvfr.fr/xmltv/xmltv_tnt.xml.gz). Attributs réels : `start`/`end`.
#      Ne s'applique qu'aux sessions réglées sur France 2/Arte/France 5 — les
#      sessions YouTube utilisent toujours l'horaire fixe (durée vidéo connue).
#   3. Navigation via browser_mod.javascript (window.location.href) : mécanisme
#      JS standard plausible, non testé en conditions réelles.
#   4. URLs "direct" France 2/Arte/France 5 : correctes au 2026-07-04, peuvent
#      changer sans préavis (structure de site web).
#
# annotations_log:
# - Création module M34 (2026-07-04).
# - v1 : 2 créneaux fixes (créneau1 EPG+chaîne, créneau2 YouTube fixe).
# - v2 (2026-07-04, même jour) : généralisé à 3 sessions identiques et
#   indépendamment activables, avec dérivation automatique de l'entité EPG
#   depuis la chaîne choisie (fin de la config manuelle fragile input_text
#   m34_epg_entity_creneau1 qui pouvait désynchroniser du input_select).
# - v3 (2026-07-05) : tentative camera.m34_tv_flux (platform generic YAML,
#   stream_source = URL HLS directe Arte) pour remplacer la redirection
#   navigateur par un flux caméra affiché nativement dans le dashboard
#   (intégration WebRTC Camera/AlexxIT + go2rtc déjà installées côté HA).
#   ÉCHEC : HA rejette la plateforme "generic" en YAML depuis plusieurs
#   versions ("does not support platform setup", confirmé dans /config/logs
#   le 2026-07-05 17:52). Retiré du package — à configurer via l'UI HA
#   (Paramètres > Appareils et services > Ajouter une intégration > Generic
#   Camera) à la place. Toujours hardcodé sur Arte pour l'instant, pas encore
#   généralisé aux 3 sessions/3 chaînes.
#   script.m34_lancer_session + browser_mod.javascript (redirection navigateur)
#   deviennent obsolètes avec l'approche caméra — la bascule se fait
#   uniquement par les cartes conditionnelles du dashboard sur
#   sensor.confo_m34_etat_global, sans action HA nécessaire. Pas encore
#   nettoyés/retirés (à trancher).
# - v4 (2026-07-07) : APPROCHE CAMÉRA ABANDONNÉE DÉFINITIVEMENT, retour à
#   100% sur script.m34_lancer_session + browser_mod.javascript (redirection
#   navigateur), qui redevient donc le mécanisme actif — plus du tout
#   obsolète. Deux bugs corrigés :
#   1. input_text.m34_browser_id_tv contenait l'entry_id de l'INTÉGRATION
#      Browser Mod (01KWPA620GM5RQTG2ZR4V3FAJE), pas un Browser ID de
#      navigateur individuel — confusion entre les deux (voir
#      .storage/core.config_entries vs Paramètres Browser Mod > Browser ID).
#      Corrigé avec le vrai Browser ID du PC de test, enregistré via
#      /browser-mod (toggle "Register" ON) : browser_mod_e7c11348_360592ea.
#   2. France 2/Arte/France 5 exigent désormais un compte France TV gratuit
#      pour le direct (politique du diffuseur depuis 2023-2024, pas un bug
#      HA). Compte créé (erodi@free.fr) et connecté sur le profil Brave
#      persistant du PC de test — session conservée, pas de reconnexion à
#      chaque lecture. Testé et confirmé fonctionnel de bout en bout le
#      2026-07-07 (redirection + lecture vidéo réelle, sans mur de connexion).
#   ⚠️ Reste à faire : refaire cette même procédure de Register Browser ID +
#   connexion France TV sur le vrai appareil kiosque final (mini-PC/RPi4),
#   PAS seulement sur ce PC de test — chaque navigateur a son propre Browser
#   ID. dashboard_kiosk.yaml (Z:) référence toujours camera.m34_tv_flux
#   (carte webrtc-camera cassée, "Camera not found") — à revenir à une
#   version sans dépendance caméra, non fait à ce stade.
# - v5 (2026-08-05) : suppression de tous les `initial:` sur ce fichier.
#   Piège HA : `initial:` réinitialise la valeur à CHAQUE redémarrage (pas
#   juste à la création) — ça écrasait les réglages TV (chaînes, horaires,
#   Browser ID, URLs) choisis sur le dashboard Configuration après chaque
#   reboot. Sans `initial:`, HA restaure le dernier état connu.
# - v6 (2026-08-14) : renommage m11_→m34_ (13/08) a changé l'entity_id des
#   input_datetime de session → nouvelles entités sans historique → horaires
#   par défaut perdus (constaté par l'utilisateur). PAS de retour à `initial:`
#   (v5 reste valable). Ajout d'un seed UNE SEULE FOIS au démarrage HA, gardé
#   par input_boolean.m34_horaires_initialises : s'applique une fois puis ne
#   touche plus jamais rien, même après reboot (contrairement à `initial:`).
#   Valeurs par défaut (demandées utilisateur) : Session1 09:00-12:00 ON,
#   Session2 14:00-17:00 ON, Session3 18:00-22:00 ON, Session4 00:00-00:00 OFF.
#   Les chaînes (input_select) ont le même problème (retombées sur "france tv"
#   par défaut, 1er choix de la liste) — récupérées depuis les anciennes
#   entités m11_session*_chaine dans .storage/core.restore_state :
#   Session1 france tv, Session2 Arte, Session3 TV5 Monde, Session4 TV5 Monde.
#   Idem input_text.m34_browser_id_tv (SÉCURITÉ, vide = touche TOUS les
#   navigateurs Browser Mod — voir point 1 plus haut) et les URLs YouTube des
#   sessions 1-3 (session 4 était déjà vide avant le renommage) — récupérés
#   depuis .storage/core.restore_state également.
# - v7 (2026-08-14) : BUG DE FOND trouvé — sensor.m34_etat_global cherchait
#   les fenêtres horaires sur sensor.m34_session_N_fenetre (sans préfixe
#   "confo_"), qui n'existent PAS. Les vrais entity_id (confirmés dans
#   .storage/core.entity_registry) sont sensor.confo_m34_session_1/3/4_fenetre
#   ET sensor.confo_m34_session_fenetre pour la session 2 (slug irrégulier,
#   sans le "2" — dérivé du texte name: au moment de la création, ne suit pas
#   les renommages ultérieurs du texte). state_attr() sur une entité
#   inexistante renvoie None → aucune session jamais détectée active → TV
#   toujours retombée sur "photos" depuis le renommage du 13/08, quelle que
#   soit l'heure. C'était la vraie cause de "pas de vidéo", pas un problème
#   de cache de template comme supposé plus tôt dans la journée.
# - v8 (2026-08-14) : trou de conception connu ("on a eu ce souci déjà") —
#   changer la CHAÎNE d'une session déjà active ne relançait jamais
#   script.m34_lancer_session (m34_verifier_sessions ne réagit qu'aux
#   transitions de SESSION, pas aux changements de chaîne en cours de
#   session). Ajout de m34_chaine_changee_en_session_active : relance
#   immédiatement la session si sa chaîne change pendant qu'elle est active.
# - v9 (2026-08-14) : marquage "déjà_vu" prématuré — script.m34_lancer_session
#   marquait l'ancienne vidéo dès qu'il re-tournait (y compris via v8 sur un
#   simple changement de chaîne), sans rapport avec le fait que la vidéo ait
#   été réellement regardée. Nouveau système : durée réelle récupérée via
#   yt-dlp (action "duration" du script Python, corrigé au passage — le
#   fichier physique shell_scripts/m16_liens_youtube.py n'avait jamais été
#   renommé en m34_, shell_command.m34_liens_youtube pointait dans le vide),
#   marquage programmé 5 min avant la fin réelle via 4 nouveaux
#   input_datetime.m34_sessionN_marquer_vu_a + l'automation
#   m34_marquer_vu_apres_visionnage (m34_liens_youtube.yaml).

