<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Vidésio</title>
<!--
  ╭──────────────────────────────────────────────────────────────────────────╮
  │       PAGE DÉDIÉE — VIDÉSIO (TV + VISIO), MODULE M34 (créée 2026-08-15)  │
  ╰──────────────────────────────────────────────────────────────────────────╯
  Rôle : page ouverte via un bouton dans aidant.html, qui affiche les
  Sessions TV (M34/M11) ET, depuis le 2026-08-18, la plage horaire des appels
  visio (M33) — regroupées ici sous le nom "Vidésio" (renommage demandé par
  l'utilisateur : "les horaires de la visio tu les mets avec les horaires
  TV"). Même choix technique que calendrier.html : embarque config.html en
  iframe avec ?only=tv plutôt que de dupliquer la logique déjà présente et
  testée dans config.html — une seule source de vérité.
  2026-08-15 (suite, remplacement des PIN) : l'ancien gate PIN partagé
  (input_text.m10_pin_pages_dediees) est retiré — jugé ingérable par
  l'utilisateur. Remplacé par un gate basé sur l'identité réelle de
  connexion (WebSocket auth/current_user -> person.* -> droit 📺 video,
  bit 8, dans input_text.m10_droits_aidants). Voir m10_gestion_aidants.yaml
  et www/config.html (même logique) pour le détail complet.
-->
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --border: rgba(255,255,255,0.07);
  --text: #f1f5f9; --text2: #94a3b8; --text3: #475569;
  --purple: #8b5cf6; --red: #ef4444; --green: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; overflow: hidden; }

/* ── ACCESS GATE (2026-08-15, remplace l'ancien gate PIN) ── */
#access-gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.pin-box { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px 24px; width: 100%; max-width: 320px; text-align: center; }
.pin-icon { font-size: 40px; margin-bottom: 10px; }
.pin-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.pin-sub { font-size: 12px; color: var(--text3); margin-bottom: 18px; }
.pin-back { display: block; margin-top: 18px; color: var(--text3); font-size: 12px; text-decoration: underline; cursor: pointer; }

/* ── PAGE ── */
#page-content { display: none; height: 100vh; flex-direction: column; }
.dedie-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;  max-width: 480px; width: 100%; margin: 0 auto; }
.dedie-back { background: rgba(255,255,255,0.06); border: none; border-radius: 8px; color: var(--text2); font-size: 18px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.dedie-title { font-size: 15px; font-weight: 600; }
#content-frame { flex: 1; width: 100%; border: none; background: var(--bg); }
</style>
</head>
<body>

<div id="access-gate">
  <div class="pin-box">
    <div class="pin-icon" id="gate-icon">📺</div>
    <div class="pin-title" id="gate-title">Vidéo</div>
    <div class="pin-sub" id="gate-sub">Vérification de tes droits d'accès…</div>
    <span class="pin-back" onclick="window.parent.closeVideo ? window.parent.closeVideo() : window.location.href='/local/aidant.html?v=' + Date.now()">← Retour</span>
  </div>
</div>

<div id="page-content">
  <div class="dedie-header">
    <button class="dedie-back" onclick="window.parent.closeVideo ? window.parent.closeVideo() : window.location.href='/local/aidant.html?v=' + Date.now()" title="Retour">←</button>
    <div class="dedie-title">📺 Vidésio — Sessions TV & Visio</div>
  </div>
  <iframe id="content-frame"></iframe>
</div>

<script>
'use strict';
const BASE = window.location.origin;
const token = localStorage.getItem('ha_token') || '';
function haSessionToken() {
  try {
    const raw = localStorage.getItem('hassTokens');
    if (!raw) return '';
    const t = JSON.parse(raw);
    if (!t || !t.access_token) return '';
    if (t.expires && Date.now() > t.expires) return '';
    return t.access_token;
  } catch (e) { return ''; }
}
function currentToken() { return haSessionToken() || token; }

// 2026-08-15 (correctif, cf. photos.html même jour) : le token de session HA
// (hassTokens, ~30 min) peut être invalide/expiré sans que notre test le
// détecte — confirmé par un log HA "Login attempt failed... invalid
// authentication" pendant le débogage de photos.html. En cas de 401, on
// retente automatiquement avec l'AUTRE source de token disponible.
async function fetchAuth(url, opts) {
  opts = opts || {};
  const baseHeaders = opts.headers || {};
  async function attempt(tok) {
    const headers = Object.assign({}, baseHeaders, { Authorization: 'Bearer ' + tok });
    return fetch(url, Object.assign({}, opts, { headers }));
  }
  const first = currentToken();
  let r = await attempt(first);
  if (r.status === 401) {
    const alt = (first === token) ? haSessionToken() : token;
    if (alt && alt !== first) r = await attempt(alt);
  }
  return r;
}

/* ─── IDENTITÉ RÉELLE — WEBSOCKET auth/current_user (2026-08-15) ───
   Remplace le gate PIN partagé (retiré — voir commentaire d'en-tête).
   Même logique que www/config.html : token -> WS auth/current_user ->
   user HA -> person.* correspondante (via attributes.user_id) -> droit
   📺 video (bit 8) dans input_text.m10_droits_aidants. */
async function apiGet(entity) {
  const r = await fetchAuth(`${BASE}/api/states/${entity}`);
  if (!r.ok) return null;
  return r.json();
}
async function apiGetAllStates() {
  const r = await fetchAuth(`${BASE}/api/states`);
  if (!r.ok) return [];
  return r.json();
}
async function loadDroits() {
  const s = await apiGet('input_text.m10_droits_aidants');
  if (!s || !s.state || s.state === 'unknown') return {};
  try { return JSON.parse(s.state); } catch (e) { return {}; }
}
function wsCurrentUser(tok) {
  return new Promise((resolve, reject) => {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${window.location.host}/api/websocket`);
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled) { settled = true; try { ws.close(); } catch(e) {} reject(new Error('timeout')); }
    }, 8000);
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'auth_required') {
        ws.send(JSON.stringify({ type: 'auth', access_token: tok }));
      } else if (msg.type === 'auth_ok') {
        ws.send(JSON.stringify({ id: 1, type: 'auth/current_user' }));
      } else if (msg.type === 'auth_invalid') {
        if (!settled) { settled = true; clearTimeout(timer); ws.close(); reject(new Error('auth_invalid')); }
      } else if (msg.type === 'result' && msg.id === 1) {
        if (!settled) {
          settled = true; clearTimeout(timer); ws.close();
          if (msg.success) resolve(msg.result); else reject(new Error('ws_error'));
        }
      }
    };
    ws.onerror = () => { if (!settled) { settled = true; clearTimeout(timer); reject(new Error('ws_connection_error')); } };
  });
}
async function resolveAccess() {
  const tok = currentToken();
  if (!tok) return null;
  let user;
  try { user = await wsCurrentUser(tok); } catch (e) { return null; }
  if (user.is_admin || user.is_owner) return { admin: true, name: user.name };
  const allStates = await apiGetAllStates();
  const person = allStates.find(s => s.entity_id.startsWith('person.') && s.attributes && s.attributes.user_id === user.id);
  if (!person) return { admin: false, mask: 0, name: user.name };
  const droits = await loadDroits();
  const objectId = person.entity_id.replace('person.', '');
  return { admin: false, mask: droits[objectId] || 0, name: person.attributes.friendly_name || user.name };
}
const DROIT_BIT_VIDEO = 8;

function unlockPage() {
  document.getElementById('access-gate').style.display = 'none';
  document.getElementById('page-content').style.display = 'flex';
  document.getElementById('content-frame').src = '/local/config.html?only=tv&v=' + Date.now();
}

async function runAccessGate() {
  const icon = document.getElementById('gate-icon');
  const title = document.getElementById('gate-title');
  const sub = document.getElementById('gate-sub');

  const access = await resolveAccess();

  if (access && (access.admin || (access.mask & DROIT_BIT_VIDEO))) {
    unlockPage();
    return;
  }

  icon.textContent = '⛔';
  title.textContent = 'Accès refusé';
  sub.textContent = access
    ? `Ton compte (${access.name || '?'}) n'a pas le droit 📺 Vidésio. Demande à l'installateur de le cocher dans Configuration → Aidants → Droits d'accès.`
    : "Impossible de t'identifier (pas de compte HA propre lié à ta fiche Personne). Voir Paramètres → Personnes → Autoriser la connexion.";
}

runAccessGate();
</script>

</body>
</html>
