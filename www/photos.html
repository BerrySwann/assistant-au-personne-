<script>
'use strict';
const BASE = window.location.origin;
const token = localStorage.getItem('ha_token') || '';
function haSessionToken() {
  try {
    const raw = localStorage.getItem('hassTokens');
    if (!raw) return '';
    const t = JSON.parse(raw);
    if (!t || !t.access_token) return '';
    if (t.expires && Date.now() > t.expires) return '';
    return t.access_token;
  } catch (e) { return ''; }
}
// 2026-08-15 (diagnostic, retour "401 même sur PC") : indique quelle source
// de token est réellement utilisée, pour afficher un diagnostic exploitable
// sans avoir besoin d'accéder à la console du navigateur.
function currentTokenSource() { return haSessionToken() ? 'session HA' : (token ? 'token mémorisé' : 'aucun'); }
function currentToken() { return haSessionToken() || token; }

// 2026-08-15 (correctif, confirmé par le log HA "Login attempt failed...
// invalid authentication") : le token de session HA (hassTokens, courte
// durée ~30 min) peut être silencieusement invalide/expiré sans que notre
// test d'expiration le détecte (le champ "expires" fourni par HA peut ne
// pas être présent/au format attendu selon le contexte). Résultat : un
// token de session pourri était utilisé alors qu'un token longue durée
// valide (ha_token) existait en repli, jamais essayé. fetchAuth() élimine
// le problème à la racine : en cas de 401, on retente automatiquement une
// fois avec l'AUTRE source de token, sans avoir à deviner laquelle est bonne.
async function fetchAuth(url, opts) {
  opts = opts || {};
  const baseHeaders = opts.headers || {};
  async function attempt(tok) {
    const headers = Object.assign({}, baseHeaders, { Authorization: 'Bearer ' + tok });
    return fetch(url, Object.assign({}, opts, { headers }));
  }
  const first = currentToken();
  let r = await attempt(first);
  if (r.status === 401) {
    const alt = (first === token) ? haSessionToken() : token;
    if (alt && alt !== first) {
      r = await attempt(alt);
    }
  }
  return r;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* ── IDENTITÉ RÉELLE — WEBSOCKET auth/current_user (2026-08-15) ───
   Remplace le gate PIN partagé (retiré — voir commentaire d'en-tête).
   Même logique que www/config.html : token -> WS auth/current_user ->
   user HA -> person.* correspondante (via attributes.user_id) -> droit
   📷 photos (bit 16) dans input_text.m10_droits_aidants. */
async function apiGet(entity) {
  const r = await fetchAuth(`${BASE}/api/states/${entity}`);
  if (!r.ok) return null;
  return r.json();
}
async function apiGetAllStates() {
  const r = await fetchAuth(`${BASE}/api/states`);
  if (!r.ok) return [];
  return r.json();
}
async function loadDroits() {
  const s = await apiGet('input_text.m10_droits_aidants');
  if (!s || !s.state || s.state === 'unknown') return {};
  try { return JSON.parse(s.state); } catch (e) { return {}; }
}
function wsCurrentUser(tok) {
  return new Promise((resolve, reject) => {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${window.location.host}/api/websocket`);
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled) { settled = true; try { ws.close(); } catch(e) {} reject(new Error('timeout')); }
    }, 8000);
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'auth_required') {
        ws.send(JSON.stringify({ type: 'auth', access_token: tok }));
      } else if (msg.type === 'auth_ok') {
        ws.send(JSON.stringify({ id: 1, type: 'auth/current_user' }));
      } else if (msg.type === 'auth_invalid') {
        if (!settled) { settled = true; clearTimeout(timer); ws.close(); reject(new Error('auth_invalid')); }
      } else if (msg.type === 'result' && msg.id === 1) {
        if (!settled) {
          settled = true; clearTimeout(timer); ws.close();
          if (msg.success) resolve(msg.result); else reject(new Error('ws_error'));
        }
      }
    };
    ws.onerror = () => { if (!settled) { settled = true; clearTimeout(timer); reject(new Error('ws_connection_error')); } };
  });
}
async function resolveAccess() {
  const tok = currentToken();
  if (!tok) return null;
  let user;
  try { user = await wsCurrentUser(tok); } catch (e) { return null; }
  if (user.is_admin || user.is_owner) return { admin: true, name: user.name };
  const allStates = await apiGetAllStates();
  const person = allStates.find(s => s.entity_id.startsWith('person.') && s.attributes && s.attributes.user_id === user.id);
  if (!person) return { admin: false, mask: 0, name: user.name };
  const droits = await loadDroits();
  const objectId = person.entity_id.replace('person.', '');
  return { admin: false, mask: droits[objectId] || 0, name: person.attributes.friendly_name || user.name };
}
const DROIT_BIT_PHOTOS = 16;

function unlockPage() {
  document.getElementById('access-gate').style.display = 'none';
  document.getElementById('page-content').style.display = 'block';
  loadGallery();
}

async function runAccessGate() {
  const icon = document.getElementById('gate-icon');
  const title = document.getElementById('gate-title');
  const sub = document.getElementById('gate-sub');

  const access = await resolveAccess();

  if (access && (access.admin || (access.mask & DROIT_BIT_PHOTOS))) {
    unlockPage();
    return;
  }

  icon.textContent = '⛔';
  title.textContent = 'Accès refusé';
  sub.textContent = access
    ? `Ton compte (${access.name || '?'}) n'a pas le droit 📷 Photos. Demande à l'installateur de le cocher dans Configuration → Sécurité → Droits d'accès.`
    : "Impossible de t'identifier (pas de compte HA propre lié à ta fiche Personne). Voir Paramètres → Personnes → Autoriser la connexion.";
}

/* ── UPLOAD (déplacé depuis config.html le 2026-08-15, PUIS revu le même
   jour, suite, DÉFINITIF) ──
   L'ancienne méthode (POST /api/media_source/local_source/upload) est la
   route officielle de HA, mais son code source (local_source.py) contient
   "if not request['hass_user'].is_admin: raise Unauthorized()" — réservée
   aux comptes ADMINISTRATEUR. Confirmé en direct : un compte "aidant" non-
   admin recevait 401 UNIQUEMENT sur cet endpoint, jamais sur la galerie/
   suppression (shell_command, pas admin-only, même token). Rendre chaque
   compte admin pour pouvoir envoyer une photo donnerait accès à toute la
   config HA — disproportionné. Remplacé par un contournement shell_command
   (même logique que la suppression, m31_photos_supprimer) : le fichier est
   lu en base64 côté page, découpé en morceaux, et envoyé par appels
   successifs à shell_command.m31_photos_televerser_{debut,chunk,fin}, qui
   écrit l'image directement sur disque dans /media/photos_famille/ — sans
   jamais passer par la route admin-only. Voir m31_photos.yaml et
   shell_scripts/m31_photos_televerser.py pour le détail. */
// 2026-08-15 (correctif, retour utilisateur "HTTP 500 sur l'upload") :
// 300 000 caractères/appel était trop gros — reproduit en direct via curl :
// 100 000 caractères passe (200), 150 000 échoue (500, "Server got itself
// in trouble" — la limite réelle de la commande shell côté serveur HA se
// situe entre les deux). Ramené à 50 000 avec marge de sécurité (2x sous le
// seuil connu-bon), validé en direct par un envoi complet de test (2 Mo,
// 56 morceaux, tous réussis).
const UPLOAD_CHUNK_SIZE = 50000;

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result || '';
      const idx = result.indexOf(',');
      resolve(idx === -1 ? result : result.slice(idx + 1));
    };
    reader.onerror = () => reject(reader.error || new Error('Lecture du fichier échouée'));
    reader.readAsDataURL(file);
  });
}

async function callShellStdout(serviceName, data) {
  const r = await apiPost(`/api/services/shell_command/${serviceName}?return_response`, data || {});
  const resp = (r && r.service_response && r.service_response['shell_command.' + serviceName])
    || (r && r.service_response)
    || null;
  return ((resp && typeof resp.stdout === 'string') ? resp.stdout : '').trim();
}

async function uploadOneFile(file, statusEl) {
  const nom = file.name;
  const b64 = await fileToBase64(file);

  let out = await callShellStdout('m31_photos_televerser_debut', { nom });
  if (!out.startsWith('OK')) throw new Error(out || 'Échec (début)');

  const total = Math.max(1, Math.ceil(b64.length / UPLOAD_CHUNK_SIZE));
  for (let i = 0, morceau = 1; i < b64.length; i += UPLOAD_CHUNK_SIZE, morceau++) {
    statusEl.textContent = `Envoi de "${nom}"… (morceau ${morceau}/${total})`;
    const chunk = b64.slice(i, i + UPLOAD_CHUNK_SIZE);
    out = await callShellStdout('m31_photos_televerser_chunk', { nom, chunk });
    if (!out.startsWith('OK')) throw new Error(out || 'Échec (envoi)');
  }

  out = await callShellStdout('m31_photos_televerser_fin', { nom });
  if (!out.startsWith('OK')) throw new Error(out || 'Échec (finalisation)');
}

async function onPhotosSelected() {
  const input = document.getElementById('photos-file-input');
  const statusEl = document.getElementById('photos-upload-status');
  const files = Array.from(input.files || []);
  if (files.length === 0) return;

  if (!currentToken()) {
    statusEl.innerHTML = '⚠️ Session non connectée — <span class="reco-link" onclick="window.parent.closePhotos ? window.parent.closePhotos() : location.href=\'/local/aidant.html?v=\'+Date.now()">appuie ici pour revenir à l\'écran Aidant</span>';
    return;
  }

  let ok = 0, fail = 0;
  let lastErrorDetail = '';
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    statusEl.textContent = `Envoi de "${file.name}"… (${i + 1}/${files.length})`;
    try {
      await uploadOneFile(file, statusEl);
      ok++;
    } catch (e) {
      fail++;
      if (!lastErrorDetail) lastErrorDetail = e && e.message ? e.message : String(e);
    }
  }

  statusEl.textContent = fail === 0
    ? `✅ ${ok} photo${ok > 1 ? 's' : ''} envoyée${ok > 1 ? 's' : ''}`
    : `⚠️ ${ok} envoyée(s), ${fail} échec(s) — ${lastErrorDetail}`;
  input.value = '';
  if (ok > 0) {
    toast('✓ Photo(s) envoyée(s)');
    loadGallery(); // rafraîchit la galerie pour montrer les nouvelles photos immédiatement
  }
}

/* ── GALERIE ── */
let currentPhotos = []; // [{source, nom}]
let objectUrls = []; // pour révocation
let pendingDelete = null; // {source, nom}

async function apiPost(path, body) {
  const r = await fetchAuth(BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadGallery() {
  const grid = document.getElementById('gallery-grid');
  const empty = document.getElementById('gallery-empty');
  try {
    // FIX confirmé le 2026-08-15 : "?return_response" SANS "=true".
    const r = await apiPost('/api/services/shell_command/m31_photos_liste?return_response', {});
    const resp = (r && r.service_response && r.service_response['shell_command.m31_photos_liste'])
      || (r && r.service_response)
      || null;
    const stdout = (resp && typeof resp.stdout === 'string') ? resp.stdout : '';
    const lignes = stdout.split('\n').map(s => s.trim()).filter(s => s !== '');
    currentPhotos = lignes.map(l => {
      const idx = l.indexOf('|');
      return idx === -1 ? { source: 'www', nom: l } : { source: l.slice(0, idx), nom: l.slice(idx + 1) };
    });
  } catch (e) {
    console.error(e);
    toast('⚠️ Erreur de chargement');
    currentPhotos = [];
  }

  // Révoque les anciennes Object URL avant de reconstruire la grille
  objectUrls.forEach(u => URL.revokeObjectURL(u));
  objectUrls = [];
  grid.innerHTML = '';

  if (currentPhotos.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  currentPhotos.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    // 2026-08-15 (correctif) : le bouton était auparavant construit avec
    // onclick="askDelete('${p.source}', ${JSON.stringify(p.nom)})" — bug
    // réel : JSON.stringify() entoure le nom de GUILLEMETS DOUBLES, qui
    // cassent l'attribut HTML onclick="..." (lui-même en guillemets
    // doubles) dès qu'un nom de fichier contenait ce motif — l'attribut
    // devenait invalide et le clic ne déclenchait plus rien. Corrigé en
    // passant par data-idx + un seul écouteur délégué sur #gallery-grid
    // (voir plus bas) : plus aucune interpolation de nom de fichier dans
    // du HTML, donc plus de risque d'échappement cassé quel que soit le nom.
    card.innerHTML = `
      <div class="photo-loading" id="loading-${i}">…</div>
      <button class="photo-del-btn" data-idx="${i}" title="Supprimer">🗑️</button>
      <span class="photo-src-tag">${p.source === 'media' ? 'envoyée' : 'samba'}</span>`;
    grid.appendChild(card);
    loadThumb(p, card, i);
  });
}

// Écouteur unique délégué (posé une fois, survit aux reconstructions de la
// grille puisqu'il est attaché au conteneur #gallery-grid, pas aux boutons).
document.getElementById('gallery-grid').addEventListener('click', function (e) {
  const btn = e.target.closest('.photo-del-btn');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const p = currentPhotos[idx];
  if (p) askDelete(p.source, p.nom);
});

async function loadThumb(p, card, i) {
  const loadingEl = document.getElementById('loading-' + i);
  try {
    let src;
    if (p.source === 'media') {
      const r = await fetchAuth(BASE + '/media/local/photos_famille/' + encodeURIComponent(p.nom));
      if (!r.ok) throw new Error('media ' + r.status);
      const blob = await r.blob();
      src = URL.createObjectURL(blob);
      objectUrls.push(src);
    } else {
      src = '/local/photos_famille/' + encodeURIComponent(p.nom) + '?t=' + Date.now();
    }
    const img = document.createElement('img');
    img.src = src;
    img.alt = p.nom;
    card.insertBefore(img, card.firstChild);
    if (loadingEl) loadingEl.remove();
  } catch (e) {
    if (loadingEl) loadingEl.textContent = '❌';
  }
}

/* ── SUPPRESSION ── */
function askDelete(source, nom) {
  pendingDelete = { source, nom };
  document.getElementById('confirm-overlay').style.display = 'flex';
}
function closeConfirm() {
  pendingDelete = null;
  document.getElementById('confirm-overlay').style.display = 'none';
}
async function confirmDelete() {
  if (!pendingDelete) return;
  const { source, nom } = pendingDelete;
  closeConfirm();
  try {
    const r = await apiPost('/api/services/shell_command/m31_photos_supprimer?return_response', { source, nom });
    const resp = (r && r.service_response && r.service_response['shell_command.m31_photos_supprimer'])
      || (r && r.service_response)
      || null;
    const stdout = ((resp && typeof resp.stdout === 'string') ? resp.stdout : '').trim();
    if (stdout.startsWith('OK') || stdout.startsWith('NOTFOUND')) {
      toast('✓ Photo supprimée');
    } else {
      toast('⚠️ ' + (stdout || 'Échec de la suppression'));
    }
  } catch (e) {
    console.error(e);
    toast('⚠️ Erreur réseau');
  }
  loadGallery();
}

runAccessGate();
</script>
