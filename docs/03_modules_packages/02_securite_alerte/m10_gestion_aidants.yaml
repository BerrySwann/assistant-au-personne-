# ╭──────────────────────────────────────────────────────────────────────────────╮
# │     MODULE M10-GESTION — CASES À COCHER AIDANTS PROXIMITÉ (PACKAGE)         │
# ╰──────────────────────────────────────────────────────────────────────────────╯
# Créé le 2026-08-05. Remplace l'idée des 2 groupes natifs "Aides" (trop caché
# dans l'UI HA, cf. retour utilisateur). À la place : une case à cocher par
# aidant, décochée par défaut, qui décide qui reçoit le SOS.
#
# ⚠️ Les 7 person.x ci-dessous (aidant_1_admin_ok ... aidant_7_hs) sont des
# comptes FICTIFS confirmés par l'utilisateur le 2026-08-05 — à remplacer par
# les vrais comptes/entity_id une fois les vrais aidants inscrits dans HA
# (Paramètres > Personnes). Le mapping ci-dessous devra être corrigé à ce
# moment-là (nom + entity_id person.x).
#
# Fonctionnement :
# - Coché = cet aidant fait partie des "aidants de proximité" → reçoit le SOS.
# - Décoché (valeur par défaut) = ne reçoit pas le SOS, seulement les alertes
#   modérées/infos (tous les aidants les reçoivent, cochés ou non).
# - Modifiable à tout moment depuis le dashboard Configuration, sans YAML,
#   sans redémarrage (juste "Recharger la configuration YAML" si l'entité
#   elle-même vient d'être ajoutée/modifiée ici).

input_boolean:
  m10_proximite_aidant_1:
    name: "Proximité — Aidant 1 admin ok"
    icon: mdi:account-heart

  m10_proximite_aidant_2:
    name: "Proximité — Aidant 2 ok"
    icon: mdi:account-heart

  m10_proximite_aidant_3:
    name: "Proximité — Aidant 3 ok"
    icon: mdi:account-heart

  m10_proximite_aidant_4:
    name: "Proximité — Aidant 4 hs"
    icon: mdi:account-heart

  m10_proximite_aidant_5:
    name: "Proximité — Aidant 5 hs"
    icon: mdi:account-heart

  m10_proximite_aidant_6:
    name: "Proximité — Aidant 6 ok"
    icon: mdi:account-heart

  m10_proximite_aidant_7:
    name: "Proximité — Aidant 7 hs"
    icon: mdi:account-heart

input_text:
  # ── Droits d'accès aidants (interface Aidant) ──────────────────────────────
  # JSON compact { "<object_id_person>": <bitmask>, ... } — max input_text = 255c
  # object_id_person = partie après "person." (ex: person.aidant_1_admin_ok -> "aidant_1_admin_ok")
  # bitmask : 0 = aucun droit | 1 = config (🔧) | 2 = messages (⚙️) | 3 = les deux
  # person.eric (admin/installateur) a TOUJOURS les deux droits, en dur dans
  # aidant.html — jamais lu depuis ce JSON, jamais modifiable ici.
  # Écrit/lu uniquement par config.html (onglet Sécurité > Droits d'accès).
  m10_droits_aidants:
    name: "M10 Droits Accès Aidants (JSON)"
    max: 255
    initial: "{}"
    icon: mdi:shield-account

  # ── Code PIN pages dédiées (calendrier.html / video.html / photos.html) ──
  # 2026-08-15 : les 3 pages dédiées (bouton dans aidant.html, une page par
  # module) sont ouvertes par défaut à N'IMPORTE QUI ayant accès au navigateur
  # de la famille — il n'existe PAS de système de connexion par personne dans
  # ce projet (aidant.html/config.html utilisent un token HA unique partagé,
  # pas une identité par utilisateur). Un PIN partagé (pas de compte par
  # aidant) est le seul mécanisme réaliste avec l'architecture actuelle.
  # ⚠️ Volontairement PAS de `initial:` ici (piège documenté ci-dessous) :
  # si tu (Eric) changes le PIN depuis config.html, il ne doit JAMAIS revenir
  # à une valeur par défaut après un redémarrage HA.
  # ⚠️ Ceci n'est PAS un vrai mécanisme de sécurité (le PIN est stocké et
  # lu en clair via l'API HA, visible par quiconque a le token) — c'est un
  # simple frein pour éviter qu'un enfant ou un aidant de passage ouvre ces
  # pages par erreur, pas une protection contre un accès malveillant.
  m10_pin_pages_dediees:
    name: "M10 Code PIN Pages Dédiées (Calendrier/Vidéo/Photos)"
    max: 10
    icon: mdi:lock-outline
    # Aucune valeur tant que non configuré depuis config.html (onglet
    # Sécurité) — voir gate PIN dans calendrier.html/video.html/photos.html :
    # tant que cette entité est vide/"unknown", les 3 pages affichent un
    # message "PIN non configuré" au lieu du clavier PIN.

# annotations_log:
# - 2026-08-05 : création. Une case à cocher par aidant fictif (7), décochée
#   par défaut, pour décider dynamiquement qui reçoit le SOS (aidants de
#   proximité). Consommé par packages/m10_groupe_aidants.yaml.
# - 2026-08-05 (correctif) : suppression de `initial: false` sur les 7
#   entités. Piège HA : `initial:` force la valeur à CHAQUE redémarrage, pas
#   seulement à la création — ça écrasait les cases cochées par l'utilisateur
#   après chaque reboot. Sans `initial:`, HA restaure le dernier état connu.
# - 2026-08-15 : ajout m10_pin_pages_dediees — PIN partagé qui protège les 3
#   nouvelles pages dédiées (calendrier.html, video.html, photos.html),
#   ouvertes depuis de nouveaux boutons dans aidant.html. Configurable
#   uniquement depuis config.html (onglet Sécurité), jamais depuis les pages
#   protégées elles-mêmes.
# - 2026-08-15 (même jour, rattrapage) : mirror docs renommé m04_→m10_
#   gestion_aidants.yaml (le fichier live utilisait déjà m10_, le mirror docs
#   était resté sur l'ancienne numérotation M04 et ne contenait même pas
#   input_text.m10_droits_aidants — dérive antérieure à cette session).
