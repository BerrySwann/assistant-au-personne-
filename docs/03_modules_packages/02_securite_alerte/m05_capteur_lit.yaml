# ╭──────────────────────────────────────────────────────────────────────────────╮
# │          MODULE M05 — CAPTEUR LIT (PACKAGE)                                 │
# ╰──────────────────────────────────────────────────────────────────────────────╯
# Source : Aqara MCCGQ11LM (Door/Window Sensor Zigbee Z2M), glissé entre matelas et sommier
# state "on" = contact fermé = lit occupé (poids de la personne)
# state "off" = contact ouvert = lit inoccupé
#
# ⚠️ MODE SIMULATION ACTIF (2026-08-05) — voir m00_simulation.yaml
# Utilise input_boolean.sim_lit_occupe à la place du vrai capteur Aqara.
# TODO AVANT DÉPLOIEMENT RÉEL : remplacer "input_boolean.sim_lit_occupe" par
# le vrai entity_id Z2M (ex: binary_sensor.aqara_lit_contact) une fois pairé.

binary_sensor:
  - platform: template
    sensors:
      m05_lit_occupe:
        friendly_name: "M05 Lit Occupé"
        device_class: occupancy
        value_template: >
          {{ is_state('input_boolean.sim_lit_occupe', 'on') }}

sensor:
  - platform: history_stats
    name: "M05 Lit Durée Occupation"
    unique_id: m05_lit_duree_occupation
    entity_id: input_boolean.sim_lit_occupe
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

# annotations_log:
# - 2026-08-05 : création module, consommé par M02 (inactivité) pour distinguer
#   sieste normale d'inactivité anormale. Entity_id à corriger après pairage réel.
