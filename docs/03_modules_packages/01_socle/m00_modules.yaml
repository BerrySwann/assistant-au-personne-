    icon: mdi:weather-night

  # ┌─────────────────────────────────────┐
  # │   SANTE                             │
  # └─────────────────────────────────────┘
  module_m20_medoc:
    name: "Santé_M20 Médicaments"
    icon: mdi:pill-multiple

  # M21 Repas : ABANDONNÉ le 2026-08-16. Raison : aucun signal fiable de
  # "repas pris". La conso d'un appareil de cuisson ne voit rien l'été (salade
  # froide), et les prises connectées sont non fiables en contexte Alzheimer
  # (la personne débranche/tripote). Le seul signal robuste (frigo/congel +
  # question posée au kiosk) ne "détecte" pas un repas, il donne un simple
  # indice — jugé insuffisant pour justifier le module. Décision utilisateur.

  module_m22_douche:
    name: "Santé_M22 Douche"
    icon: mdi:shower-head

  # ┌─────────────────────────────────────┐
