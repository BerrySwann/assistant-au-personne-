# ╭──────────────────────────────────────────────────────────────────────────────╮
# │          MODULE M00 — INTERRUPTEURS MODULES + UTILITAIRES SYSTÈME           │
# ╰──────────────────────────────────────────────────────────────────────────────╯
# Convention entity_id : max 20 chars après "module_"
#
# ⚠️ Correctif 2026-08-05 : suppression de tous les `initial:`. Piège HA :
# `initial:` réinitialise la valeur à CHAQUE redémarrage (pas juste à la
# création), ce qui écrasait les choix de l'utilisateur sur le dashboard
# Configuration après chaque reboot. Sans `initial:`, HA restaure le dernier
# état connu de chaque interrupteur.
#
# ⚠️ Renommage 2026-08-13 : entity_id ET name: alignés sur la nouvelle
# numérotation par groupe (oblig/Secur/Santé/Confo/Envir). Voir
# docs/RENOMMAGE_TABLE.md pour la correspondance ancien/nouveau complète.

sensor:
  - platform: time_date
    display_options:
      - time
      - date
      - date_time

input_boolean:

  # ┌─────────────────────────────────────┐
  # │   OBLIGATOIRES                      │
  # └─────────────────────────────────────┘
  module_m01_temp_hygro:
    name: "oblig_M01 Température & Hygro"
    icon: mdi:thermometer

  module_m02_inactivite:
    name: "oblig_M02 Détection Inactivité"
    icon: mdi:motion-sensor

  module_m03_ecran_msg:
    name: "oblig_M03 Écran Messages"
    icon: mdi:message-text-outline

  module_m04_calendrier:
    name: "oblig_M04 Calendrier"
    icon: mdi:calendar-month-outline

  # ┌─────────────────────────────────────┐
  # │   M02 — CAPTEURS ACTIFS (PRÉSENCE) │
  # │   Activé via appairage.html        │
  # └─────────────────────────────────────┘
  # Double-check dans m02_inactivite.yaml :
  # boolean ON + entité capteur not in [unavailable, unknown]
  m02_presence_salon_actif:
    name: "M02 Présence Salon Active"
    icon: mdi:radar

  m02_presence_chambre_actif:
    name: "M02 Présence Chambre Active"
    icon: mdi:radar

  m02_pir_cuisine_actif:
    name: "M02 PIR Cuisine Actif"
    icon: mdi:motion-sensor

  m02_pir_couloir_actif:
    name: "M02 PIR Couloir Actif"
    icon: mdi:motion-sensor

