    icon: mdi:motion-sensor

  # ┌─────────────────────────────────────┐
  # │   SECURITE                          │
  # └─────────────────────────────────────┘
  module_m10_sos:
    name: "Secur_M10 Bouton SOS"
    icon: mdi:alarm-light-outline

  module_m11_capteur_lit:
    name: "Secur_M11 Capteur Lit"
    icon: mdi:bed-outline

  module_m12_cam_ia:
    name: "Secur_M12 Caméra IA"
    icon: mdi:eye-outline

  module_m13_porte_ext:
    name: "Secur_M13 Porte Extérieure"
    icon: mdi:door-open

  module_m14_fenetre:
    name: "Secur_M14 Fenêtres"
    icon: mdi:window-open-variant

  module_m17_lumiere_nuit:
