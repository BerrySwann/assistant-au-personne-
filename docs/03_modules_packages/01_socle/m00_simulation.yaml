# ╭──────────────────────────────────────────────────────────────────────────────╮
# │          MODULE M00-SIM — CAPTEURS FICTIFS (PROTOTYPAGE SANS MATÉRIEL)      │
# ╰──────────────────────────────────────────────────────────────────────────────╯
# But : simuler les capteurs Zigbee pas encore achetés/pairés (SNZB-06P, WOOX
# SOS, Aqara lit) pour tester la logique des automations M02/M04/M05 sans
# matériel physique. Chaque helper se manipule à la main dans
# Developer Tools > États, ou via une carte dashboard simple (voir en bas).
#
# ⚠️ À FAIRE LE JOUR OÙ LE VRAI MATÉRIEL ARRIVE :
# - Remplacer les entity_id "input_boolean.sim_*" par les vrais entity_id Z2M
#   dans m02_inactivite.yaml, m04_sos.yaml, m05_capteur_lit.yaml.
# - Supprimer ce fichier (ou le laisser inactif, il ne gêne rien s'il n'est
#   plus référencé nulle part).

input_boolean:
  sim_snzb06p_presence:
    name: "SIMU — Présence Salon (radar)"
    initial: true
    icon: mdi:radar

  sim_sos_bouton:
    name: "SIMU — Bouton SOS pressé"
    initial: false
    icon: mdi:alarm-light-outline

  sim_lit_occupe:
    name: "SIMU — Lit Occupé"
    initial: false
    icon: mdi:bed-outline

# ┌─────────────────────────────────────────────────────────┐
# │ Reset automatique du bouton SOS simulé après 2 secondes │
# │ (imite un vrai bouton Zigbee qui n'a pas d'état "on"    │
# │ permanent — c'est une impulsion, pas un interrupteur)   │
# └─────────────────────────────────────────────────────────┘
automation:
  - id: sim_sos_impulsion
    alias: "SIMU - Reset auto bouton SOS après appui"
    trigger:
      - platform: state
        entity_id: input_boolean.sim_sos_bouton
        to: "on"
    action:
      - delay: "00:00:02"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.sim_sos_bouton
    mode: single

