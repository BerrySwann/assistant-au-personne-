title: "Interface Aidant"
views:
  - path: aidant
    title: Aidant
    type: panel
    cards:
      - type: vertical-stack
        cards:

          # ═══════════════════════════════════════════
          # CHIPS — STATUT RAPIDE
          # ═══════════════════════════════════════════
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:thermometer
                icon_color: >
                  {% set s = states('sensor.m01_alerte_temperature') %}
                  {% if s in ['froid','froid_chambre'] %}blue{% elif s == 'canicule' %}red{% else %}green{% endif %}
                content: "{{ states('sensor.snzb02d_salon_temperature') | round(1) }}°"
              - type: template
                icon: mdi:door-open
                icon_color: >
                  {% if is_state('binary_sensor.snzb04p_porte_ext_contact', 'off') %}red{% else %}green{% endif %}
                content: >
                  {% if is_state('binary_sensor.snzb04p_porte_ext_contact', 'off') %}Ouverte{% else %}Fermée{% endif %}
              - type: template
                icon: mdi:message-text
                icon_color: >
                  {% set s = states('sensor.m03_bandeau_principal') %}
                  {% if s == 'agenda_urgent' %}red{% elif s in ['agenda_proche','texto'] %}orange{% else %}grey{% endif %}
                content: >
                  {% if states('sensor.m03_bandeau_principal') == 'vide' %}Aucun msg{% else %}Message actif{% endif %}
            card_mod:
              style: |
                ha-card { background: none !important; box-shadow: none !important; padding: 4px 0; }

          # ═══════════════════════════════════════════
          # ENVOYER UN MESSAGE (M03)
          # ═══════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "💬 Message pour la personne aidée"
            card_mod:
              style: |
                ha-card { background: none !important; box-shadow: none !important; }
                .title { font-size: 0.85em !important; font-weight: 500 !important; color: var(--secondary-text-color) !important; text-transform: uppercase !important; letter-spacing: 1.5px !important; }

          - type: entities
            entities:
              - entity: input_text.m03_message_auteur
                name: "De"
                icon: mdi:account
              - entity: input_text.m03_message_famille
                name: "Message"
                icon: mdi:pencil-outline
            card_mod:
              style: |
                ha-card {
                  background: rgba(var(--rgb-primary-text-color), 0.04) !important;
                  border-radius: 16px !important;
                  border: 1px solid rgba(var(--rgb-primary-text-color), 0.08) !important;
                  box-shadow: none !important;
                }

          - type: custom:button-card
            icon: mdi:send
            name: Envoyer le message
            tap_action:
              action: call-service
              service: input_datetime.set_datetime
              service_data:
                entity_id: input_datetime.m03_message_envoi
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            styles:
              card:
                - background: "linear-gradient(135deg, #2563eb, #1d4ed8)"
                - border-radius: "14px"
                - border: none
                - box-shadow: "0 4px 16px rgba(37,99,235,0.35)"
                - padding: "14px"
              name:
                - color: white
                - font-size: "1em"
                - font-weight: "500"
              icon:
                - color: white
                - width: "20px"

          # ═══════════════════════════════════════════
          # ACTIONS RAPIDES
          # ═══════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "⚡ Actions rapides"
            card_mod:
              style: |
                ha-card { background: none !important; box-shadow: none !important; margin-top: 8px; }
                .title { font-size: 0.85em !important; font-weight: 500 !important; color: var(--secondary-text-color) !important; text-transform: uppercase !important; letter-spacing: 1.5px !important; }

          - type: grid
            columns: 3
            square: true
            cards:
              - type: custom:button-card
                icon: mdi:video-outline
                name: Visio
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/visio
                styles:
                  card:
                    - background: "linear-gradient(135deg, #065f46, #047857)"
                    - border-radius: "18px"
                    - box-shadow: "0 4px 20px rgba(4,120,87,0.3)"
                    - border: none
                  name:
                    - color: white
                    - font-size: "0.85em"
                    - font-weight: "500"
                  icon:
                    - color: white
                    - width: "32px"

              - type: custom:button-card
                entity: media_player.chromecast_salon
                icon: mdi:television-play
                name: TV Salon
                show_state: false
                tap_action:
                  action: more-info
                styles:
                  card:
                    - background: >
                        [[[
                          return entity && entity.state === 'playing'
                            ? 'linear-gradient(135deg, #7c3aed, #6d28d9)'
                            : 'linear-gradient(135deg, #1e1e2e, #2a2a3e)';
                        ]]]
                    - border-radius: "18px"
                    - box-shadow: "0 4px 20px rgba(0,0,0,0.3)"
                    - border: "1px solid rgba(255,255,255,0.08)"
                  name:
                    - color: white
                    - font-size: "0.85em"
                    - font-weight: "500"
                  icon:
                    - color: >
                        [[[
                          return entity && entity.state === 'playing' ? 'white' : '#6b7280';
                        ]]]
                    - width: "32px"

              - type: custom:button-card
                entity: binary_sensor.snzb04p_porte_ext_contact
                icon: mdi:door-open
                name: Porte
                show_state: false
                tap_action:
                  action: more-info
                styles:
                  card:
                    - background: >
                        [[[
                          return entity && entity.state === 'off'
                            ? 'linear-gradient(135deg, #7f1d1d, #991b1b)'
                            : 'linear-gradient(135deg, #1e1e2e, #2a2a3e)';
                        ]]]
                    - border-radius: "18px"
                    - box-shadow: "0 4px 20px rgba(0,0,0,0.3)"
                    - border: "1px solid rgba(255,255,255,0.08)"
                  name:
                    - color: white
                    - font-size: "0.85em"
                    - font-weight: "500"
                  icon:
                    - color: >
                        [[[
                          return entity && entity.state === 'off' ? '#f87171' : '#6b7280';
                        ]]]
                    - width: "32px"

          # ═══════════════════════════════════════════
          # TEMPÉRATURE (M01)
          # ═══════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "🌡️ Ambiance"
            card_mod:
              style: |
                ha-card { background: none !important; box-shadow: none !important; margin-top: 8px; }
                .title { font-size: 0.85em !important; font-weight: 500 !important; color: var(--secondary-text-color) !important; text-transform: uppercase !important; letter-spacing: 1.5px !important; }

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.snzb02d_salon_temperature') | round(1) }}°C"
            secondary: "{{ states('sensor.m01_resume_temp_salon') }}"
            icon: mdi:sofa
            icon_color: >
              {% set t = states('sensor.snzb02d_salon_temperature') | float(20) %}
              {% if t < 16 %}blue{% elif t > 28 %}red{% else %}green{% endif %}
            card_mod:
              style: |
                ha-card {
                  background: rgba(var(--rgb-primary-text-color), 0.04) !important;
                  border-radius: 16px !important;
                  border: 1px solid rgba(var(--rgb-primary-text-color), 0.07) !important;
                  box-shadow: none !important;
                }

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.snzb02d_chambre_temperature') | round(1) }}°C"
            secondary: "{{ states('sensor.m01_resume_temp_chambre') }}"
            icon: mdi:bed-outline
            icon_color: >
              {% set t = states('sensor.snzb02d_chambre_temperature') | float(20) %}
              {% if t < 16 %}blue{% elif t > 28 %}red{% else %}green{% endif %}
            card_mod:
              style: |
                ha-card {
                  background: rgba(var(--rgb-primary-text-color), 0.04) !important;
                  border-radius: 16px !important;
                  border: 1px solid rgba(var(--rgb-primary-text-color), 0.07) !important;
                  box-shadow: none !important;
                }
