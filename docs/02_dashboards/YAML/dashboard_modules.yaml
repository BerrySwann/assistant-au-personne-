              style: |
                ha-card { background: none !important; box-shadow: none !important; margin-top: 8px; }
                .title { font-size: 0.82em !important; font-weight: 600 !important; text-transform: uppercase !important; letter-spacing: 2px !important; color: #f59e0b !important; }
                .subtitle { font-size: 0.75em !important; color: var(--secondary-text-color) !important; }

          # ─── M04 bis : qui reçoit le SOS (cases à cocher, décochées par défaut) ───
