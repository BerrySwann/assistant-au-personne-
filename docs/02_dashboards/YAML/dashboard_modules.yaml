title: "Configuration"
views:
  - path: general
    title: "✅ Général"
    icon: mdi:check-circle
    type: panel
    cards:
      - type: vertical-stack
        cards:

          # ═══════════════════════════════════════════
          # EN-TÊTE
          # ═══════════════════════════════════════════
          - type: custom:button-card
            show_icon: false
            show_name: true
            show_label: true
            name: "Système d'assistance"
            label: "Activation des modules — redémarrer HA après modification"
            styles:
              card:
                - background: "linear-gradient(135deg, #1e1e2e 0%, #2a2a40 100%)"
                - border-radius: "20px"
                - border: "1px solid rgba(255,255,255,0.07)"
                - box-shadow: none
                - padding: "20px 24px"
              name:
                - font-size: "1.4em"
                - font-weight: "300"
                - color: white
                - letter-spacing: "1px"
              label:
                - font-size: "0.78em"
                - color: "#6b7280"
                - font-weight: "400"
                - padding-top: "4px"

          # ═══════════════════════════════════════════
          # OBLIGATOIRES
          # ═══════════════════════════════════════════
          - type: custom:mushroom-title-card
            title: "✅ Obligatoires"
            subtitle: "Toujours actifs — ne pas désactiver"
            card_mod:
              style: |
                ha-card { background: none !important; box-shadow: none !important; }
                .title { font-size: 0.82em !important; font-weight: 600 !important; text-transform: uppercase !important; letter-spacing: 2px !important; color: #22c55e !important; }
                .subtitle { font-size: 0.75em !important; color: var(--secondary-text-color) !important; }

          - type: custom:button-card
            entity: input_boolean.module_m01_temp_hygro
            name: "M01 — Température & Hygrométrie"
            label: "Surveillance T° et humidité par pièce, alertes froid/canicule"
            show_icon: true
            show_name: true
            show_label: true
            icon: "[[[ return entity.state === 'on' ? 'mdi:toggle-switch' : 'mdi:toggle-switch-off'; ]]]"
            tap_action:
              action: toggle
            styles:
              card:
                - background: "rgba(34,197,94,0.06)"
                - border-radius: "14px"
                - border: "1px solid rgba(34,197,94,0.15)"
                - box-shadow: none
                - display: grid
                - grid-template-columns: "1fr auto"
                - grid-template-areas: "'n i' 'l i'"
                - padding: "12px 16px"
                - text-align: left
              icon:
                - grid-area: i
                - color: "[[[ return entity.state === 'on' ? '#22c55e' : 'rgba(var(--rgb-primary-text-color),0.3)'; ]]]"
                - width: "38px"
              name:
                - grid-area: n
                - justify-self: start
                - font-size: "0.95em"
              label:
                - grid-area: l
                - justify-self: start
                - font-size: "0.72em"
                - color: "#6b7280"

          - type: custom:button-card
            entity: input_boolean.module_m02_inactivite
            name: "M02 — Détection Inactivité"
            label: "Alerte si aucun mouvement détecté pendant une durée anormale"
            show_icon: true
            show_name: true
            show_label: true
            icon: "[[[ return entity.state === 'on' ? 'mdi:toggle-switch' : 'mdi:toggle-switch-off'; ]]]"
            tap_action:
              action: toggle
            styles:
              card:
                - background: "rgba(34,197,94,0.06)"
                - border-radius: "14px"
                - border: "1px solid rgba(34,197,94,0.15)"
                - box-shadow: none
                - display: grid
                - grid-template-columns: "1fr auto"
                - grid-template-areas: "'n i' 'l i'"
                - padding: "12px 16px"
                - text-align: left
              icon:
                - grid-area: i
                - color: "[[[ return entity.state === 'on' ? '#22c55e' : 'rgba(var(--rgb-primary-text-color),0.3)'; ]]]"
                - width: "38px"
              name:
                - grid-area: n
                - justify-self: start
                - font-size: "0.95em"
              label:
                - grid-area: l
                - justify-self: start
                - font-size: "0.72em"
                - color: "#6b7280"

          - type: custom:button-card
            entity: input_boolean.module_m03_ecran_msg
